<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Too Clean - Serviços de Limpeza</title>
  
  <!-- Biblioteca de ícones (ativa o logótipo do WhatsApp) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; color: #333; background-color: #f9f9f9; }
    h1 { color: #0056b3; text-align: center; }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .service-card { background: white; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    /* Botão Flutuante Verde do WhatsApp */
    .whatsapp-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white !important;
      border-radius: 50px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    .whatsapp-btn i {
      font-size: 22px;
    }
  </style>
</head>
<body>

  <h1>Too Clean - Serviços de Limpeza</h1>

  <div class="services-grid">
    <div class="service-card">
      <h3>Limpeza Residencial</h3>
      <p>Manutenção e higienização completa para o seu lar.</p>
    </div>
    <div class="service-card">
      <h3>Limpeza de Condomínios</h3>
      <p>Manutenção periódica de áreas comuns, escadas, entradas e elevadores.</p>
    </div>
    <div class="service-card">
      <h3>Limpeza de Garagens</h3>
      
    </div>
  </div>

  <!-- Botão Direto de WhatsApp com Ícone Visível -->
  <a href="https://wa.me/qr/5CH7GBQLHW7GM1" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-whatsapp"></i> Falar no WhatsApp
  </a>

</body>
</html>
