  <title>Too Clean - Serviços Profissionais de Limpeza</title>

  <style>
    :root {
      --bg-nude: #F9F6F0;
      --card-nude: #F3ECE1;
      --accent-nude: #E8DEC8;
      --green-dark: #2C4A3E;
      --green-sage: #5B7065;
      --green-light: #EBF0EC;
      --whatsapp-green: #25D366;
      --text-dark: #2B2B2B;
      --text-muted: #666666;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-nude);
      color: var(--text-dark);
      line-height: 1.6;
      padding-bottom: 90px;
    }

    /* Cabeçalho Clean */
    header {
      background-color: var(--white);
      text-align: center;
      padding: 45px 20px 35px;
      border-bottom: 1px solid rgba(44, 74, 62, 0.08);
    }

    .brand-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--green-dark);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--green-sage);
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* Content Container */
    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 35px 20px;
    }

    /* Secção Sobre Nós */
    .about-card {
      background-color: var(--white);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 35px;
      box-shadow: 0 4px 20px rgba(44, 74, 62, 0.04);
      border: 1px solid var(--accent-nude);
    }

      font-size: 20px;
      font-weight: 600;
      color: var(--green-dark);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
